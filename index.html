<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>UFO Sightings — filterable table</title>
<meta name="description" content="Filter sixteen January 2010 UFO sighting reports by date range, city, state, country, shape and text; sort any column; export the filtered rows as CSV. Dataset vendored, logic unit-tested. By Freddrick Logan.">
<meta name="author" content="Freddrick Logan">
<link rel="canonical" href="https://freddricklogan.github.io/UFO-Sightings/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b1220'/%3E%3Cellipse cx='16' cy='17' rx='9' ry='3.2' fill='none' stroke='%2358a6ff' stroke-width='1.8'/%3E%3Cpath d='M10 15.5c1.2-2.4 3.4-4 6-4s4.8 1.6 6 4' fill='none' stroke='%2358a6ff' stroke-width='1.8'/%3E%3Ccircle cx='16' cy='11' r='1.3' fill='%233fb950'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap">
<link rel="stylesheet" href="src/exec-shell.css">
<link rel="stylesheet" href="src/app.css">
</head>
<body>
<main id="demo-root" class="exec-main">
  <section class="panel" aria-labelledby="h-filters">
    <h2 id="h-filters">Filter sightings</h2>
    <form id="filter-form" class="filters" novalidate>
      <div class="field"><label for="from">From date</label><input type="date" id="from" min="2010-01-01"></div>
      <div class="field"><label for="to">To date</label><input type="date" id="to"></div>
      <div class="field"><label for="city">City contains</label><input type="text" id="city" placeholder="e.g. el cajon" autocomplete="off"></div>
      <div class="field"><label for="state">State</label><select id="state"></select></div>
      <div class="field"><label for="country">Country</label><select id="country"></select></div>
      <div class="field"><label for="shape">Shape</label><select id="shape"></select></div>
      <div class="field"><label for="text">Comments contain</label><input type="text" id="text" placeholder="e.g. bright" autocomplete="off"></div>
      <div class="button-row"><button type="submit" class="btn btn--primary">Filter</button><button type="button" class="btn" id="reset-btn">Reset</button><button type="button" class="btn" id="export-btn">Export CSV</button></div>
    </form>
    <p class="meta" id="count" aria-live="polite">—</p>
    <ul class="shapes" id="shapes"></ul>
  </section>
  <section class="panel" aria-label="Sightings table">
    <div class="table-wrapper"><table><thead><tr id="head-row"></tr></thead><tbody id="ufo-table"></tbody></table></div>
    <p class="method" id="source-note">—</p>
  </section>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
